services:
  api:
    build: .
    restart: unless-stopped
    expose:
      - "8010"
    environment:
      DATABASE_URL: sqlite:////data/frl.db
      JWT_SECRET: ${JWT_SECRET:?请在部署环境设置 JWT_SECRET}
      JWT_EXPIRE_DAYS: ${JWT_EXPIRE_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_AUTH_CODE: ${SMTP_AUTH_CODE:-}
      PACK_DIR: /pack
    volumes:
      - ./data:/data
      - ./pack:/pack:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
