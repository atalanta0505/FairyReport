name: Release FairyReport Desktop (Windows)

# GitHub 的云机器：打 v* 标签时自动编译 Windows 便携版并发布。
# 只做 Windows —— 不再构建 macOS / Linux 桌面版，也不再产出未签名的安装包。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows portable package
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      # Windows 运行器的 Python 控制台默认 cp1252，脚本里的中文输出会报错
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-engine.txt pyinstaller

      - name: Build standalone Python engine (sidecar)
        run: python scripts/build_engine.py

      - name: Install desktop frontend dependencies
        run: npm --prefix desktop ci

      - name: Build Tauri application
        run: npm --prefix desktop run tauri build

      - name: Check guides match current version
        run: python scripts/check_guides.py

      - name: Export guide docx from Markdown
        run: |
          python scripts/export_beginner_guide_docx.py
          python scripts/export_user_guide_docx.py

      - name: Pack portable Windows zip
        run: python scripts/pack_portable.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: FairyReport-Windows-portable
          path: dist/FairyReport-Local-v*-Windows-x64.zip

      - name: Prepare release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/release_notes.py "${{ github.ref_name }}" release-notes.md

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: release-notes.md
          files: dist/FairyReport-Local-v*-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
