name: Release FairyReport Desktop (Cross-Platform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build ${{ matrix.os }} (${{ matrix.target }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_ext: .exe

          - os: macos-latest
            target: aarch64-apple-darwin
            asset_ext: .dmg

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_ext: .AppImage

    runs-on: ${{ matrix.os }}

    env:
      # Windows 运行器的 Python 控制台默认 cp1252，脚本里的中文 print 会 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux GUI system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-engine.txt pyinstaller

      - name: Build Standalone Python Engine (Sidecar)
        run: |
          python scripts/build_engine.py

      - name: Install Desktop Frontend Dependencies
        run: |
          npm --prefix desktop ci

      - name: Build Tauri Application
        run: |
          npm --prefix desktop run tauri build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FairyReport-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**
            desktop/src-tauri/target/release/fairyreport-desktop*

      - name: Prepare release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python scripts/release_notes.py "${{ github.ref_name }}" release-notes.md
          type release-notes.md || cat release-notes.md

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: release-notes.md
          files: |
            desktop/src-tauri/target/release/bundle/**
            desktop/src-tauri/target/release/fairyreport-desktop*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
