<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Document Base -->
  <rect x="22" y="14" width="56" height="72" rx="10" fill="url(#primaryGrad)" shadow="true" />
  
  <!-- Document Fold / Accent -->
  <path d="M56 14 L78 36 L56 36 Z" fill="#1e40af" opacity="0.6"/>
  <path d="M56 14 L78 36 L56 14 Z" fill="url(#accentGrad)" opacity="0.4"/>

  <!-- Content Lines -->
  <rect x="32" y="42" width="36" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
  <rect x="32" y="52" width="28" height="5" rx="2.5" fill="#ffffff" opacity="0.75"/>
  <rect x="32" y="62" width="32" height="5" rx="2.5" fill="#ffffff" opacity="0.75"/>
  <rect x="32" y="72" width="20" height="5" rx="2.5" fill="#93c5fd" opacity="0.9"/>

  <!-- Magic Sparkles / Fairy Wings -->
  <path d="M68 28 Q78 18 86 24 Q82 34 72 34 Z" fill="url(#accentGrad)" opacity="0.85" filter="url(#glow)"/>
  <circle cx="78" cy="22" r="3" fill="url(#sparkleGrad)" filter="url(#glow)"/>
  <circle cx="20" cy="35" r="2.5" fill="url(#sparkleGrad)"/>
  <circle cx="82" cy="65" r="2" fill="#fbbf24"/>
  <circle cx="22" cy="75" r="1.5" fill="#60a5fa"/>
</svg>
