version: "3.8"

services:
  fairyreport:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fairyreport-cloud
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - ENGINE_DATA_DIR=/app/data
    volumes:
      - fairyreport_data:/app/data

volumes:
  fairyreport_data:
    driver: local
