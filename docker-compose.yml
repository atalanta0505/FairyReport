version: "3.8"

services:
  fairyreport-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: fairyreport-engine:latest
    container_name: fairyreport-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENGINE_DATA_DIR=/app/data
      - HF_ENDPOINT=https://hf-mirror.com
    env_file:
      - .env
    volumes:
      # 持久化数据目录：底稿资料、项目向量库、导出成果文件均落盘于宿主机 ./data
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
