[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairyreport-mcp"
version = "1.6.5"
description = "Local-first structured consulting & engineering report workbench and MCP Server (15 report templates, 3-source RAG, cross-chapter numerical consistency verification, publication-grade DOCX export)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "FairyReport Contributors" }
]
keywords = [
    "mcp",
    "mcp-server",
    "report-generation",
    "rag",
    "feasibility-study",
    "docx",
    "consulting",
    "engineering-report",
    "local-first"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "fastembed>=0.3.0",
    "chromadb>=0.5.0",
    "openai>=1.40.0",
    "python-docx>=1.1.0",
    "docx2txt>=0.8",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "markdownify>=0.12.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=5.0.0",
    "mcp>=1.6.0",
]

[project.urls]
Homepage = "https://github.com/atalanta0505/FairyReport"
Repository = "https://github.com/atalanta0505/FairyReport"
Issues = "https://github.com/atalanta0505/FairyReport/issues"

[project.scripts]
fairyreport-mcp = "engine.mcp_server:main"
fairyreport-engine = "engine.app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]
